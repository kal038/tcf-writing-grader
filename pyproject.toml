[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcf-importer"
version = "1.0.0"
description = "Local, durable TCF learning-note importer for Obsidian"
requires-python = ">=3.11"
dependencies = ["watchdog>=4,<7", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "openai>=1.0.0", "python-dotenv>=1.0.0"]

[project.scripts]
tcf-importer = "tcf_importer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "test_main.py"]
